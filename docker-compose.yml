version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xebia-rag-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Nag@1234}
      MYSQL_DATABASE: ${DB_NAME:-hr_portal}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: xebia-rag-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xebia-rag-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - INDEX_NAME=${INDEX_NAME}
      - INDEX_NAME_CACHE=${INDEX_NAME_CACHE}
      - HF_TOKEN=${HF_TOKEN}
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Nag@1234}
      - DB_NAME=${DB_NAME:-hr_portal}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - rag-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xebia-rag-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rag-network

volumes:
  mysql_data:
  ollama_data:

networks:
  rag-network:
    driver: bridge
